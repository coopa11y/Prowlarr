name: Build a11y image

on:
  workflow_dispatch:
  push:
    branches:
      - nvda-a11y

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.421

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Build linux-x64 package
        run: bash build.sh --backend --frontend --packages --runtime linux-x64 --framework net8.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prowlarr-a11y.Dockerfile
          push: true
          tags: ghcr.io/coopa11y/prowlarr:nvda-a11y
          build-args: |
            PROWLARRVERSION=10.0.0.0
            PROWLARRBRANCH=nvda-a11y
